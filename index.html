<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17243a">
  <title>宅建 Study Portal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=20261016-minhoshi-paper-solve-fix">
</head>
<body>
  <div id="app">
    <section id="loginView" class="screen">
      <div class="login-card">
        <h1>宅建 Study Portal</h1>
        <p>自分専用の学習記録</p>
        <form id="loginForm">
          <label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
          <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">ログイン</button>
        </form>
        <p id="loginMsg" class="msg"></p>
      </div>
    </section>

    <section id="mainView" class="screen hidden">
      <header>
        <div class="brand-group">
          <button id="brandHome" class="brand-home" type="button" aria-label="ホームへ戻る"><svg class="lucide lucide-book-open" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 7v14"/><path d="M3 18V5a2 2 0 0 1 2-2h2a5 5 0 0 1 5 5 5 5 0 0 1 5-5h2a2 2 0 0 1 2 2v13a1 1 0 0 1-1 1h-3a5 5 0 0 0-5 2 5 5 0 0 0-5-2H4a1 1 0 0 1-1-1Z"/></svg><span>宅建 Study</span></button>
          <small id="userEmail"></small>
        </div>
        <button id="themeQuickBtn" class="ghost icon-action" type="button" aria-label="テーマを変更" title="テーマを変更"><svg class="lucide lucide-palette" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="13.5" cy="6.5" r=".5" fill="currentColor"/><circle cx="17.5" cy="10.5" r=".5" fill="currentColor"/><circle cx="8.5" cy="7.5" r=".5" fill="currentColor"/><circle cx="6.5" cy="12.5" r=".5" fill="currentColor"/><path d="M12 22a10 10 0 1 1 10-10c0 1.7-1.3 3-3 3h-1.8c-.8 0-1.2.7-1.2 1.4 0 .6.4 1.2.4 2.1A3.5 3.5 0 0 1 12 22Z"/></svg></button>
        <button id="logoutBtn" class="ghost icon-logout" aria-label="ログアウト" title="ログアウト"><svg class="lucide lucide-log-out" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg></button>
      </header>

      <nav class="tabs">
        <button data-tab="home" class="active">ホーム</button>
        <button data-tab="topics">分野別</button>
        <button data-tab="resources">教材別</button>
        <button data-tab="recent">最近</button>
        <button data-tab="settings">設定</button>
      </nav>

      <div id="treeControls" class="tree-controls hidden"><button id="expandAllBtn" type="button"><svg class="lucide lucide-chevrons-up-down" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 15 4 4 4-4 M8 9l4-4 4 4"/></svg><span>展開</span></button><button id="collapseAllBtn" type="button"><svg class="lucide lucide-chevrons-down-up" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 4 4 4-4"/><path d="m8 19 4-4 4 4"/></svg><span>折りたたむ</span></button></div>
      <main id="content"></main>
      <button id="scrollTopBtn" class="scroll-top hidden" type="button" aria-label="上に戻る"><svg class="lucide lucide-arrow-up" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 12 7-7 7 7M12 19V5"/></svg></button>
    </section>
  </div>

  <script type="module" src="./app.js?v=20261016-minhoshi-paper-solve-fix"></script>
</body>
</html>
