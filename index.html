<!doctype html>
<html lang="ja" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#17243a">
  <title>宅建 Study Portal</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css?v=20260910-resource-clean3">
</head>
<body>
  <div id="app">
    <section id="loginView" class="screen">
      <div class="login-card">
        <h1>宅建 Study Portal</h1>
        <p>自分専用の学習記録</p>
        <form id="loginForm">
          <label>メールアドレス<input id="email" type="email" autocomplete="username" required></label>
          <label>パスワード<input id="password" type="password" autocomplete="current-password" required></label>
          <button type="submit">ログイン</button>
        </form>
        <p id="loginMsg" class="msg"></p>
      </div>
    </section>

    <section id="mainView" class="screen hidden">
      <header>
        <div>
          <h1>宅建 Study</h1>
          <small id="userEmail"></small>
        </div>
        <button id="logoutBtn" class="ghost">ログアウト</button>
      </header>

      <nav class="tabs">
        <button data-tab="home" class="active">ホーム</button>
        <button data-tab="topics">分野別</button>
        <button data-tab="resources">教材別</button>
        <button data-tab="recent">最近</button>
        <button data-tab="settings">設定</button>
      </nav>

      <main id="content"></main>
    </section>
  </div>

  <script type="module" src="./app.js?v=20260910-resource-clean3"></script>
</body>
</html>
